[package]
name = "kona-std-fpvm"
description = "Platform specific APIs for interacting with Fault Proof VM kernels."
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace
kona-preimage.workspace = true

# External
cfg-if.workspace = true
thiserror.workspace = true
buddy_system_allocator.workspace = true
async-trait.workspace = true

# `tracing` feature dependencies
tracing = { workspace = true, optional = true }

# Client programs link std-only crates whose `rand_core` pulls in getrandom 0.2, which has no
# backend for `os = "zkvm"`; `zkvm.rs` registers a deterministic one.
[target.'cfg(target_os = "zkvm")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[package.metadata.cargo-udeps.ignore]
normal = ["buddy_system_allocator"]

[features]
tracing = [ "dep:tracing" ]
