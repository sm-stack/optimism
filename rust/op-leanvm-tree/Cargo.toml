[package]
name = "op-leanvm-tree"
description = "leanVM tree aggregates for OP Stack derivation: the tree class, its verifier and its aggregator"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["sequencer"]
# The sequencer's admission checks and aggregator. Their guest libraries build only for
# little-endian targets: the fault proof program leaves this out.
sequencer = ["dep:leansphincs", "dep:leansphincs-members-host", "dep:leanvm_guest", "dep:tracing"]
# Embed the class key in the binary, built by the build script: for the fault proof program, which
# runs from scratch every time and whose prestate binds the binary.
embedded-class-key = ["dep:leanvm"]

[dependencies]
alloy-primitives.workspace = true
leansphincs = { workspace = true, optional = true }
leansphincs-members-host = { workspace = true, optional = true }
leanvm.workspace = true
leanvm_guest = { workspace = true, optional = true }
op-alloy-consensus.workspace = true
tracing = { workspace = true, optional = true }

[build-dependencies]
leanvm = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true

[[example]]
name = "fixtures"
required-features = ["sequencer"]

[[example]]
name = "pins"
required-features = ["sequencer"]

[[example]]
name = "sign"
required-features = ["sequencer"]

[[example]]
name = "class_key"
