# Builds the EIP-8130 Keystore and the OP Stack STATEMENT authenticator. The creation and runtime bytecode the
# clients deploy at Lagoon is committed under op-core/eip8130; `./build.sh` regenerates it and must leave it unchanged.
[profile.default]
src = "src"
out = "out"
solc = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "osaka"
bytecode_hash = "none"
cbor_metadata = false

[lint]
lint_on_build = false
